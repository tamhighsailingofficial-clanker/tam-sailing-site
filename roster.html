<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Tam High Sailing roster: team captains and sailors by class year." />
  <title>Roster | Tam Sailing</title>
  <link rel="icon" type="image/x-icon" href="icons/tam-logo-mini.png">
  <link rel="stylesheet" href="styles.css">
  <script src="site.js" defer></script>
  <script src="sheet-config.js" defer></script>
  <script src="sheets.js" defer></script>
</head>
<body>
  <header class="site-header" data-include="/partials/nav.html"></header>

  <section class="hero" aria-label="Roster page header">
    <img class="hero-image" src="images/sea-otter-regatta-2025.png" alt="Boats by the beach at the Sea Otter Regatta, 2025">
    <div class="hero-content">
      <h1>Roster</h1>
    </div>
  </section>

  <main id="main">
    <section id="roster" class="grid one" data-sheet="roster">
      <h2 class="section-title text">Leadership</h2>
      <div class="grid captains" data-slot="captains"></div>
      <div class="grid" data-slot="classes"></div>
    </section>
  </main>

  <footer class="footer" data-include="/partials/footer.html"></footer>
</body>
</html>
